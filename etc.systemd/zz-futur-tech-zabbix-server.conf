###############################################################################
# Futur-Tech Zabbix Server - systemd overrides for MariaDB
#
# Deployed by futur-tech-zabbix-server/deploy.sh into
# /etc/systemd/system/mariadb.service.d/ - DO NOT EDIT ON THE SERVER, it is
# overwritten on every deploy.
#
# MariaDB cannot raise open_files_limit above the file-descriptor limit systemd
# grants the unit. Debian's packaging caps LimitNOFILE at 32768, which silently
# clamps the `open_files_limit = 65535` set in 99-futur-tech-zabbix-server.cnf -
# the server simply reports 32768 and carries on.
#
# The zz- prefix is deliberate: systemd applies drop-ins in lexicographic order
# and the last one wins, so this file must sort after the package's own
# migrated-from-my.cnf-settings.conf drop-in.
#
# Requires `systemctl daemon-reload` followed by a MariaDB restart to take
# effect; deploy.sh does the reload, the restart is left to the operator.
###############################################################################

[Service]
LimitNOFILE=65535
